# Checks, builds and deploys modelspec.org (the Cloudflare Worker modelspec-org).
#
#   pull_request        checks and the production build only; never deploys
#   push to main        checks, build, deploy, smoke check
#   workflow_dispatch   run from main only (any other ref is refused). This is how a change in a data
#                       repository arrives: its notify-sites workflow starts this one. It first asks
#                       whether anything changed (the commit of this repository, or the checksum of an
#                       index the site is built from, compared with the build marker the live site
#                       serves) and ends at once, green, when not; the boolean input `force` skips that
#                       question; the string input `reason` is shown in the run summary.
#
# There is no timer: nothing here runs on a schedule.
#
# Deploying needs the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable (an identifier,
# not a secret). Without either, every step except the deploy and the smoke check still runs and the run
# ends green with a notice. A manual run without them (and without `force`) stops at once:
# it has nothing to deploy to.
#
# The build and the deploy are the ones `npm run build` and `npm run deploy` run by hand
# (scripts/build.mjs, scripts/deploy.mjs); their guards stay in force. See "Deployment" in README.md.
# site.yml (tests only, no secrets) keeps running beside this workflow.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Skip the check that the live site is out of date and deploy main anyway
        type: boolean
        default: false
      reason:
        description: Why this run was started (shown in the run summary; free text)
        type: string
        default: ""

permissions:
  contents: read

# One deploy at a time: a notified run and a push never interleave. A queued run is replaced by a newer
# one, which builds the newer main, so nothing is lost. Pull request runs only cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: check · build · deploy
    # never in a fork
    if: github.repository == 'specscore/modelspec'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      BUILD_COMMIT: ${{ github.sha }}
      # inputs of a manual run, as data: never interpolated into a command or an expression
      FORCE: ${{ inputs.force }}
      REASON: ${{ inputs.reason }}
      # 'false' for a manual run without `force`: it changes nothing in this repository, so it skips the browser tests
      FULL_CHECKS: ${{ github.event_name != 'workflow_dispatch' || inputs.force }}
      # 'true' when this run may publish: a push to main or a manual run on main
      DEPLOY_EVENT: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      # 'true' when the token and the account id exist (compared here, so the secret is not copied into a step)
      HAS_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Refuse to deploy from another ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::A manual run deploys main only: start it on main, not on ${GITHUB_REF_NAME}."
          exit 1
      # Actions are pinned by full commit SHA (the tag is in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Manual runs: decide first, with nothing installed, so a run with nothing to do ends in seconds.
      - name: Run summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          # untrusted text: control characters (so no line can start a workflow command) and backticks are dropped
          reason="$(printf '%s' "$REASON" | tr -d '\000-\037\140' | cut -c1-200)"
          echo "Manual run on ${GITHUB_REF_NAME} (force: ${FORCE}). Reason: \"${reason}\"" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Manual run without credentials
        if: github.event_name == 'workflow_dispatch' && env.FORCE != 'true' && env.HAS_CREDENTIALS != 'true'
        run: |
          echo "::notice::No CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable: there is nothing to deploy to, so this run stops here (run it with force to check and build anyway)."
          echo "Run stopped: no CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable, so there is nothing to deploy to." >> "$GITHUB_STEP_SUMMARY"
          echo "BUILD_NEEDED=false" >> "$GITHUB_ENV"
      - name: Is the live site current?
        if: github.event_name == 'workflow_dispatch' && env.FORCE != 'true' && env.HAS_CREDENTIALS == 'true'
        run: node scripts/check-fresh.mjs

      - name: Install
        if: env.BUILD_NEEDED != 'false'
        run: npm ci
      - name: Unit tests
        if: env.BUILD_NEEDED != 'false'
        run: npm test
      - name: Syntax checks and fixture build
        if: env.BUILD_NEEDED != 'false'
        run: npm run check
      # The production build reads the three live indexes and fails when one is unreadable; the guard then
      # refuses a dist/ that is not exactly the production site.
      - name: Production build
        if: env.BUILD_NEEDED != 'false'
        run: npm run build
      - name: Production build guard
        if: env.BUILD_NEEDED != 'false'
        run: node scripts/check-build.mjs

      # The browser tests use the committed fixtures and never touch dist/. A manual run without `force`
      # changes nothing in this repository, so it skips them.
      - name: Install the browser
        if: env.FULL_CHECKS == 'true' && env.BUILD_NEEDED != 'false'
        run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop and 375px, against fixture builds served by wrangler dev)
        if: env.FULL_CHECKS == 'true' && env.BUILD_NEEDED != 'false'
        run: npm run test:e2e

      - name: Deploy skipped, no credentials
        if: env.BUILD_NEEDED != 'false' && env.DEPLOY_EVENT == 'true' && env.HAS_CREDENTIALS != 'true'
        run: |
          echo "::notice::Deploy and smoke check skipped: no CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable. The checks and the production build passed."
          echo "Deploy and smoke check skipped: no CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable. The checks and the production build passed." >> "$GITHUB_STEP_SUMMARY"
      # `npm run deploy` checks, builds dist/ again from the three production indexes, verifies it and runs wrangler.
      - name: Deploy
        if: env.BUILD_NEEDED != 'false' && env.DEPLOY_EVENT == 'true' && env.HAS_CREDENTIALS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Smoke check (the live site serves this build)
        if: env.BUILD_NEEDED != 'false' && env.DEPLOY_EVENT == 'true' && env.HAS_CREDENTIALS == 'true'
        run: node scripts/smoke-live.mjs
